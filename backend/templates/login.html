{% extends 'base.html' %}

{% block title %}Login — ResearchAI{% endblock %}

{% block content %}
    <div style="display:flex;align-items:center;justify-content:center;min-height:60vh">
        <div class="card" style="max-width:420px;width:100%">
            <h2 style="margin:0 0 8px">Welcome back</h2>
            <p class="muted">Login to your ResearchAI account</p>

            <form method="POST" action="/login" style="margin-top:12px;display:flex;flex-direction:column;gap:8px">
                <input type="text" name="username" placeholder="Username" required />
                <input type="password" name="password" placeholder="Password" required />
                <div style="display:flex;gap:8px;margin-top:6px">
                    <button type="submit" class="btn">Sign In</button>
                    <a href="/register" class="btn ghost">Register</a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
