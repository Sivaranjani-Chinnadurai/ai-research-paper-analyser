{% extends 'auth_base.html' %}

{% block title %}Create Account — ResearchAI{% endblock %}

{% block content %}
<div class="card" style="width: 100%; max-width: 440px; padding: 2.5rem 2rem;">
    <h2 style="margin-bottom: 0.5rem; text-align: center;">Create your account</h2>
    <p class="text-muted" style="text-align: center; margin-bottom: 2rem;">Start chatting with your research papers.</p>

    <form method="POST" action="/register" style="display: flex; flex-direction: column; gap: 1rem;">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div>
                <label style="font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; display: block;">First Name</label>
                <input type="text" name="first_name" placeholder="Alan" required />
            </div>
            <div>
                <label style="font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; display: block;">Last Name</label>
                <input type="text" name="last_name" placeholder="Turing" required />
            </div>
        </div>

        <div>
            <label style="font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; display: block;">Username</label>
            <input type="text" name="username" placeholder="Choose a username" required />
        </div>

        <div>
            <label style="font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; display: block;">Password</label>
            <input type="password" name="password" placeholder="Create a secure password" required />
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div>
                <label style="font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; display: block;">Phone (Optional)</label>
                <input type="tel" name="phone" placeholder="+1..." />
            </div>
            <div>
                <label style="font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; display: block;">Date of Birth</label>
                <input type="date" name="dob" />
            </div>
        </div>

        <button type="submit" class="btn" style="width: 100%; padding: 0.75rem; margin-top: 0.5rem; font-size: 1rem;">Create Account</button>
    </form>

    <p style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem;" class="text-muted">
        Already have an account? <a href="/login">Sign in</a>
    </p>
</div>
{% endblock %}
