{% extends 'auth_base.html' %}

{% block title %}Sign In — ResearchAI{% endblock %}

{% block content %}
<div class="card" style="width: 100%; max-width: 400px; padding: 2.5rem 2rem;">
    <h2 style="margin-bottom: 0.5rem; text-align: center;">Welcome back</h2>
    <p class="text-muted" style="text-align: center; margin-bottom: 2rem;">Sign in to your intelligent workspace.</p>

    <form method="POST" action="/login" style="display: flex; flex-direction: column; gap: 1rem;">
        <div>
            <label style="font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; display: block;">Username</label>
            <input type="text" name="username" placeholder="Enter your username" required autofocus />
        </div>
        <div>
            <label style="font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; display: block;">Password</label>
            <input type="password" name="password" placeholder="••••••••" required />
        </div>
        
        <button type="submit" class="btn" style="width: 100%; padding: 0.75rem; margin-top: 0.5rem; font-size: 1rem;">Sign In</button>
    </form>

    <p style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem;" class="text-muted">
        Don't have an account? <a href="/register">Create one</a>
    </p>
</div>
{% endblock %}
